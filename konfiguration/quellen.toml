# Datenquellen für `klima laden`.
#
# Jeder Abschnitt beschreibt einen Datensatz. Unterstützte Typen:
#
#   typ = "datei"        Feste Liste von URLs (`urls`). Keine zeitliche Einschränkung möglich.
#   typ = "stationsauswahl"  Eine Datei je Station; `url` enthält den Platzhalter `{station}`.
#                        Geladen wird mit `klima laden <name> --station <ID> …`.
#   typ = "verzeichnis"  Verzeichnisliste unter `url` wird abgerufen, Dateien werden über den
#                        regulären Ausdruck `muster` ausgewählt. Enthält das Muster benannte Gruppen
#                        `jahr` (und optional `monat`) oder `beginn`/`ende` (JJJJMMTT), wirken
#                        `--von`/`--bis` als Dateiauswahl.
#
# Weitere Schlüssel:
#   beschreibung  Kurzbeschreibung für `klima laden --liste`
#   standard      true = wird ohne Angabe eines Datensatzes geladen
#
# Archive (.tar.gz, .zip, .gz) werden nicht entpackt, sondern bei der Auswertung
# direkt im Arbeitsspeicher gelesen (klima.archiv).
#
# Geprüft am 2026-10-07, Details siehe SPEC.md Abschnitt 2.7.

# --- GHCN-Monthly v4 (Landstationen, Monatsmittel) --------------------------

[ghcnm_qcu]
beschreibung = "GHCN-Monthly v4, Temperatur, unbereinigt (QCU)"
typ = "datei"
urls = ["https://www.ncei.noaa.gov/pub/data/ghcn/v4/ghcnm.tavg.latest.qcu.tar.gz"]
standard = true

[ghcnm_qcf]
beschreibung = "GHCN-Monthly v4, Temperatur, homogenisiert (QCF)"
typ = "datei"
urls = ["https://www.ncei.noaa.gov/pub/data/ghcn/v4/ghcnm.tavg.latest.qcf.tar.gz"]
standard = true

[ghcnm_laender]
beschreibung = "GHCN-Monthly v4, Ländercodes (FIPS) und Ländernamen"
typ = "datei"
urls = ["https://www.ncei.noaa.gov/pub/data/ghcn/v4/ghcnm-countries.txt"]
standard = true

[ghcnm_qfe]
beschreibung = "GHCN-Monthly v4, homogenisiert + Lücken geschätzt, nur 1961–2010 (QFE)"
typ = "datei"
urls = ["https://www.ncei.noaa.gov/pub/data/ghcn/v4/ghcnm.tavg.latest.qfe.tar.gz"]
standard = false

# --- Ozean -------------------------------------------------------------------

[ersst_v5]
beschreibung = "ERSST v5, Meeresoberflächentemperatur, 2°×2°, eine Datei pro Monat"
typ = "verzeichnis"
url = "https://www.ncei.noaa.gov/pub/data/cmb/ersst/v5/netcdf/"
muster = 'ersst\.v5\.(?P<jahr>\d{4})(?P<monat>\d{2})\.nc'
standard = true

# --- Vergleichsreihen ----------------------------------------------------------

[gistemp]
beschreibung = "NASA GISTEMP v4, globale und hemisphärische Mittel (Land+Ozean, nur Land)"
typ = "datei"
urls = [
    "https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv",
    "https://data.giss.nasa.gov/gistemp/tabledata_v4/NH.Ts+dSST.csv",
    "https://data.giss.nasa.gov/gistemp/tabledata_v4/SH.Ts+dSST.csv",
    "https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts.csv",
]
standard = true

[hadcrut5]
beschreibung = "Met Office HadCRUT 5.2, Jahresmittel Land+Ozean (aufgefüllt und nicht aufgefüllt)"
typ = "datei"
# Die Versionsnummer steckt im Pfad; bei neuen Versionen hier anpassen.
urls = [
    "https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/analysis/diagnostics/HadCRUT.5.2.0.0.analysis.summary_series.global.annual.csv",
    "https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/analysis/diagnostics/HadCRUT.5.2.0.0.analysis.summary_series.northern_hemisphere.annual.csv",
    "https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/analysis/diagnostics/HadCRUT.5.2.0.0.analysis.summary_series.southern_hemisphere.annual.csv",
    "https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/non-infilled/diagnostics/HadCRUT.5.2.0.0.noninfilled.summary_series.global.annual.csv",
    "https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/non-infilled/diagnostics/HadCRUT.5.2.0.0.noninfilled.summary_series.northern_hemisphere.annual.csv",
    "https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/non-infilled/diagnostics/HadCRUT.5.2.0.0.noninfilled.summary_series.southern_hemisphere.annual.csv",
]
standard = true

# --- Deutscher Wetterdienst ----------------------------------------------------

[dwd_stationen]
beschreibung = "DWD, Stationslisten für Tages- und Monatswerte (Klima-Kollektiv KL)"
typ = "datei"
urls = [
    "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/daily/kl/historical/KL_Tageswerte_Beschreibung_Stationen.txt",
    "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/monthly/kl/historical/KL_Monatswerte_Beschreibung_Stationen.txt",
]
standard = true

[dwd_monat_historisch]
beschreibung = "DWD, Monatswerte je Station (Temperatur, Niederschlag u. a.), geprüft, bis Ende Vorjahr"
typ = "verzeichnis"
url = "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/monthly/kl/historical/"
muster = 'monatswerte_KL_\d{5}_(?P<beginn>\d{8})_(?P<ende>\d{8})_hist\.zip'
standard = true

[dwd_monat_aktuell]
beschreibung = "DWD, Monatswerte je Station, aktuell (ca. letzte 500 Tage), vorläufig geprüft"
typ = "verzeichnis"
url = "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/monthly/kl/recent/"
muster = 'monatswerte_KL_\d{5}_akt\.zip'
standard = true

[dwd_tag_historisch]
beschreibung = "DWD, Tageswerte je Station (Temperatur, Niederschlag u. a.), geprüft, bis Ende Vorjahr"
typ = "verzeichnis"
url = "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/daily/kl/historical/"
muster = 'tageswerte_KL_\d{5}_(?P<beginn>\d{8})_(?P<ende>\d{8})_hist\.zip'
standard = true

[dwd_tag_aktuell]
beschreibung = "DWD, Tageswerte je Station, aktuell (ca. letzte 500 Tage), vorläufig geprüft"
typ = "verzeichnis"
url = "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/daily/kl/recent/"
muster = 'tageswerte_KL_\d{5}_akt\.zip'
standard = true

[dwd_gebietsmittel_temperatur]
beschreibung = "DWD, Gebietsmittel Lufttemperatur (Deutschland + Bundesländer), monatlich"
typ = "verzeichnis"
url = "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/monthly/air_temperature_mean/"
muster = 'regional_averages_tm_\d{2}\.txt'
standard = true

[dwd_gebietsmittel_niederschlag]
beschreibung = "DWD, Gebietsmittel Niederschlag (Deutschland + Bundesländer), monatlich"
typ = "verzeichnis"
url = "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/monthly/precipitation/"
muster = 'regional_averages_rr_\d{2}\.txt'
standard = true

[dwd_gebietsmittel_kenntage]
beschreibung = "DWD, jährliche Gebietsmittel der Kenntage (Sommertage, heiße Tage, Tropennächte, Frost-, Eis-, Starkregentage)"
typ = "datei"
urls = [
    "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/annual/summer_days/regional_averages_txas_year.txt",
    "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/annual/hot_days/regional_averages_txbs_year.txt",
    "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/annual/tropical_nights_tminGE20/regional_averages_tnes_year.txt",
    "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/annual/frost_days/regional_averages_tnas_year.txt",
    "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/annual/ice_days/regional_averages_txcs_year.txt",
    "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/annual/precipGE10mm_days/regional_averages_rrsfs_year.txt",
    "https://opendata.dwd.de/climate_environment/CDC/regional_averages_DE/annual/precipGE20mm_days/regional_averages_rrsgs_year.txt",
]
standard = true

# --- GHCN-Daily (Tageswerte) ---------------------------------------------------

[ghcnd_stationen]
beschreibung = "GHCN-Daily, Stationsliste und Inventar (Elemente und Zeiträume je Station)"
typ = "datei"
urls = [
    "https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.txt",
    "https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-inventory.txt",
]
standard = false

[ghcnd_jahre]
beschreibung = "GHCN-Daily, alle Stationen weltweit, eine Datei pro Jahr (20–170 MB je Jahr!)"
typ = "verzeichnis"
url = "https://www.ncei.noaa.gov/pub/data/ghcn/daily/by_year/"
muster = '(?P<jahr>\d{4})\.csv\.gz'
standard = false

[ghcnd_tageswerte]
beschreibung = "GHCN-Daily, Tageswerte ausgewählter Stationen weltweit (klima laden ghcnd_tageswerte --station ID)"
typ = "stationsauswahl"
url = "https://www.ncei.noaa.gov/pub/data/ghcn/daily/by_station/{station}.csv.gz"
standard = false
