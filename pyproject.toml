[project]
name = "klimadaten-auswertung"
version = "0.1.0"
description = "Eigene Auswertung der globalen Temperaturentwicklung aus Stations- und Meeresrohdaten"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.scripts]
klima = "klima.kommandozeile:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klima"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
